name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The generated code is committed, so it must match the committed schema.
      - run: bun run generate
      - run: test -z "$(git status --porcelain)"
      - run: bun run verify

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported runtime and one that also has WebSocket.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack the package
        run: npm pack --pack-destination "$RUNNER_TEMP"
      # Nothing leaves the runner: fetch is stubbed, and the endpoint is only a required option. The
      # optional peer is not installed in the throwaway project either, so this also checks that a
      # request needs neither graphql-ws nor a WebSocket, on the oldest supported runtimes.
      - name: Install and use the packed package
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init --yes > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/*.tgz > /dev/null
          node --input-type=module -e "
            const { createStash } = await import('stash-graphql-client');
            const closing = new AbortController();
            const stash = createStash({
              endpoint: 'http://stash.test/graphql',
              signal: closing.signal,
              // Answers the request itself, so no Stash instance is needed, and no network either.
              fetch: async () => Response.json({ data: { version: { version: 'stub' } } }),
            });
            const call = new AbortController();
            const version = await stash.version((info) => ({ version: info.version }), {
              signal: call.signal,
            });
            if (version.version !== 'stub') throw new Error('unexpected response');
          "
