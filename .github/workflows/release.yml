name: Release

# Publishes the version in package.json when it is not on npm yet. Merging the update pull request
# from update.yml releases it; to release your own changes, bump the version in the same commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run build
      - name: Show the package contents
        run: bun pm pack --dry-run

      # Only the README that npm shows names the Stash version; the one in the repository stays as is.
      - run: bun scripts/readme-version.ts

      # Trusted publishing: npm trusts this workflow through GitHub's short-lived identity token,
      # so no npm token is stored. It needs npm 11.5.1 or newer, which the runner image may lack.
      - name: Publish to npm
        run: |
          npm install --global npm@latest
          npm publish --provenance

      - name: Tag and create the GitHub release
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
